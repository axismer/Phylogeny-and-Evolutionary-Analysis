# 服务端口
server.port=8080

# 文件上传限制
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# 应用名称
spring.application.name=PhyloPlatform

# ===== MySQL 数据库配置 =====
spring.datasource.url=jdbc:mysql://localhost:3306/phylo_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=dtdeDu283**+

# JPA 配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== 文件存储配置 =====
phylo.storage.path=./data/sequences
phylo.storage.result-path=./data/results

# ===== JWT 配置 =====
phylo.jwt.secret=PhyloPlatformSecretKey2026ForJWTTokenGenerationAndValidation
phylo.jwt.expiration=86400000
