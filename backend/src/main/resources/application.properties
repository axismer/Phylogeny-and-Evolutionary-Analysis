spring.application.name=phylo-platform

# 数据根目录：相对于 backend 模块运行目录，指向 phylo-platform/data
phylo.data.root=../data

# R Framework（ProcessBuilder → runners/run_analysis.R）
# 若 PATH 中已有 Rscript，可改为 Rscript
phylo.r.rscript=D:/R-4.4.2/bin/Rscript.exe
phylo.r.root=../r-analysis
phylo.r.script=runners/run_analysis.R
phylo.r.timeout-seconds=600

# multipart 上传上限（任务 FASTA / metadata）
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

server.port=8080
